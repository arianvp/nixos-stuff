[aliases]
mine = ["log", "-r", "ancestors(mine() & mutable(), 3)"]
fetch = ["fetch", "--all-remotes", "--tracked"]
fetch-pr = ["util", "exec", "--", "gh", "pr", "checkout", "--detach"]
yeet = ["util", "exec", "--", "bash", "-c", "set -eu; jj bookmark advance && jj git push", "jj-yeet"]
stack = ["util", "exec", "--", "jj-stack"]
meta = ["util", "exec", "--", "jj-meta"]
pushm = ["util", "exec", "--", "bash", "-c", 'set -eu; jj git push "$@" && jj-meta push', "jj-pushm"]
fetchm = ["util", "exec", "--", "bash", "-c", 'set -eu; jj git fetch "$@" && jj-meta pull', "jj-fetchm"]
rebase-mine = ["rebase", "--source", "roots(mutable() & mine())", "--onto", "trunk()", "--simplify-parents", "--skip-emptied"]
[revset-aliases]
"mine()" = 'author_name(exact:"Arian van Putten")'
